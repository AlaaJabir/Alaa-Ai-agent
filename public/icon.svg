<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="rgba(139,92,246,0.3)" stroke-width="2"/>

  <!-- Core Agent Shield / Diamond Icon -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal Neural Core -->
    <polygon points="256,150 340,200 340,312 256,362 172,312 172,200" fill="url(#primaryGrad)" fill-opacity="0.2" stroke="url(#primaryGrad)" stroke-width="4"/>
    <!-- Inner Core Nexus -->
    <circle cx="256" cy="256" r="32" fill="url(#coreGlow)"/>
    <circle cx="256" cy="256" r="16" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Constellation Nodes -->
  <circle cx="256" cy="150" r="8" fill="#60a5fa"/>
  <circle cx="340" cy="200" r="7" fill="#818cf8"/>
  <circle cx="340" cy="312" r="7" fill="#a78bfa"/>
  <circle cx="256" cy="362" r="8" fill="#60a5fa"/>
  <circle cx="172" cy="312" r="7" fill="#818cf8"/>
  <circle cx="172" cy="200" r="7" fill="#38bdf8"/>
</svg>
